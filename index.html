<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain For Sale</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 60px 40px;
            background: rgba(255, 255, 255, 0.03);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 520px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .domain-icon {
            width: 80px;
            height: 80px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 30px;
            font-size: 36px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.4);
        }

        h1 {
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: #667eea;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .domain-name {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, #a8a8a8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .price-tag {
            display: inline-block;
            background: linear-gradient(135deg, #00c9ff 0%, #92fe9d 100%);
            color: #1a1a2e;
            padding: 8px 24px;
            border-radius: 30px;
            font-weight: 600;
            font-size: 18px;
            margin-bottom: 30px;
        }

        p {
            color: #a0a0a0;
            line-height: 1.7;
            margin-bottom: 35px;
            font-size: 15px;
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 16px 48px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            font-family: inherit;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .check-btn:hover {
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 15px 40px rgba(102, 126, 234, 0.5);
        }

        .features {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-top: 40px;
            padding-top: 30px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        .feature {
            text-align: center;
        }

        .feature-icon {
            font-size: 24px;
            margin-bottom: 8px;
        }

        .feature-text {
            font-size: 12px;
            color: #888;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .gif-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .gif-overlay img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 20px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="domain-icon">🌐</div>
        <h1>This Domain Is For Sale</h1>
        <div class="domain-name" id="domainName">example.com</div>
        <div class="price-tag">$2,499</div>
        <p>This premium domain name is available for purchase. Perfect for your next big project. Make an offer or buy it now before someone else does.</p>
        
        <div class="features">
            <div class="feature">
                <div class="feature-icon">⚡</div>
                <div class="feature-text">Instant Transfer</div>
            </div>
            <div class="feature">
                <div class="feature-icon">🔒</div>
                <div class="feature-text">Secure Payment</div>
            </div>
            <div class="feature">
                <div class="feature-icon">📋</div>
                <div class="feature-text">Free Transfer</div>
            </div>
        </div>
    </div>

    <button class="check-btn" id="checkBtn">Check Availability</button>

    <div class="gif-overlay" id="gifOverlay">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjBnczgydDBlcmExeDAyNmJ5OXNmcWZmZWJ6dW50ZDM3Y3FjNWdsZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/GCO5WNzFmlc0vjK8cA/giphy.gif" alt="Surprise!">
    </div>

    <script>
        const btn = document.getElementById('checkBtn');
        const overlay = document.getElementById('gifOverlay');
        const closeBtn = document.getElementById('closeBtn');
        
        let clickCount = 0;
        const weirdPositions = [
            { left: '10%', top: '20%', rotate: '15deg', scale: '0.8' },
            { left: '85%', top: '15%', rotate: '-20deg', scale: '1.2' },
            { left: '5%', top: '80%', rotate: '25deg', scale: '0.9' },
            { left: '90%', top: '75%', rotate: '-10deg', scale: '1.1' },
            { left: '50%', top: '5%', rotate: '180deg', scale: '1' },
            { left: '20%', top: '60%', rotate: '-45deg', scale: '0.7' },
            { left: '75%', top: '45%', rotate: '90deg', scale: '1.3' },
            { left: '15%', top: '35%', rotate: '-30deg', scale: '0.85' },
            { left: '60%', top: '90%', rotate: '45deg', scale: '1.15' },
            { left: '3%', top: '3%', rotate: '120deg', scale: '0.6' },
        ];

        btn.addEventListener('click', function(e) {
            clickCount++;
            
            if (clickCount >= 3) {
                overlay.style.display = 'flex';
                return;
            }

            const pos = weirdPositions[Math.floor(Math.random() * weirdPositions.length)];
            
            btn.style.left = pos.left;
            btn.style.top = pos.top;
            btn.style.transform = `translate(-50%, -50%) rotate(${pos.rotate}) scale(${pos.scale})`;
            
            const messages = [
                'Hmm, still checking...',
                'Almost there...',
                'Just a bit more...',
                'Getting closer...',
                'One more try?',
                'Keep going...',
                'You can do it!',
                'Nearly found it...'
            ];
            
            if (clickCount === 1) {
                btn.textContent = 'Checking...';
            } else if (clickCount === 2) {
                btn.textContent = messages[Math.floor(Math.random() * messages.length)];
            }
        });

        closeBtn.addEventListener('click', function() {
            overlay.style.display = 'none';
        });

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                overlay.style.display = 'none';
            }
        });

        const domainName = document.getElementById('domainName');
        domainName.textContent = window.location.hostname || 'this-domain.com';
    </script>
</body>
</html>
