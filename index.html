<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain For Sale</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 50px 40px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px);
            max-width: 480px;
            width: 90%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }

        .domain-icon {
            width: 70px;
            height: 70px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 24px;
            font-size: 32px;
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
        }

        h1 {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #667eea;
            margin-bottom: 12px;
            font-weight: 600;
        }

        .domain-name {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 20px;
            background: linear-gradient(90deg, #fff, #ccc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        p {
            color: #999;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .check-btn {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            border: none;
            padding: 14px 40px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.15s, box-shadow 0.15s;
            font-family: inherit;
            position: fixed;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }

        .check-btn:hover {
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .gif-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
        }

        .gif-overlay img {
            max-width: 80%;
            max-height: 80%;
            border-radius: 16px;
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 40px;
            color: #fff;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .close-btn:hover {
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="domain-icon">🌐</div>
        <h1>Domain For Sale</h1>
        <div class="domain-name" id="domainName">example.com</div>
        <p>This domain may be available for purchase. Inquire below to check availability and pricing.</p>
    </div>

    <button class="check-btn" id="checkBtn">Check Availability</button>

    <div class="gif-overlay" id="gifOverlay">
        <span class="close-btn" id="closeBtn">&times;</span>
        <img src="https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjBnczgydDBlcmExeDAyNmJ5OXNmcWZmZWJ6dW50ZDM3Y3FjNWdsZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/GCO5WNzFmlc0vjK8cA/giphy.gif" alt="Surprise!">
    </div>

    <script>
        const btn = document.getElementById('checkBtn');
        const overlay = document.getElementById('gifOverlay');
        const closeBtn = document.getElementById('closeBtn');
        
        let clickCount = 0;

        function getRandomPosition() {
            const padding = 80;
            const btnWidth = 180;
            const btnHeight = 50;
            
            const maxX = window.innerWidth - btnWidth - padding;
            const maxY = window.innerHeight - btnHeight - padding;
            
            const x = Math.max(padding, Math.random() * maxX);
            const y = Math.max(padding, Math.random() * maxY);
            
            return { left: x + 'px', top: y + 'px' };
        }

        btn.addEventListener('click', function(e) {
            clickCount++;
            
            if (clickCount >= 3) {
                overlay.style.display = 'flex';
                return;
            }

            const pos = getRandomPosition();
            
            btn.style.left = pos.left;
            btn.style.top = pos.top;
            btn.style.transform = 'translate(0, 0)';
            
            if (clickCount === 1) {
                btn.textContent = 'Checking...';
            } else {
                btn.textContent = 'Almost there...';
            }
        });

        closeBtn.addEventListener('click', function() {
            overlay.style.display = 'none';
        });

        overlay.addEventListener('click', function(e) {
            if (e.target === overlay) {
                overlay.style.display = 'none';
            }
        });

        const domainName = document.getElementById('domainName');
        domainName.textContent = window.location.hostname || 'this-domain.com';
    </script>
</body>
</html>
