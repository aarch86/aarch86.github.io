<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Domain Available</title>

<style>
body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,Arial;
    background:#f6f8fc;
}

.card{
    width:520px;
    background:white;
    padding:60px 70px 40px;
    border-radius:18px;
    box-shadow:0 20px 45px rgba(0,0,0,0.08);
    text-align:center;
    position:relative;
}

.domain{
    font-size:30px;
    font-weight:600;
    margin-bottom:8px;
}

.subtitle{
    color:#666;
    margin-bottom:35px;
}

#buyBtn{
    position:absolute;
    left:50%;
    transform:translateX(-50%);
    padding:15px 34px;
    border:none;
    border-radius:12px;
    background:#4f46e5;
    color:white;
    font-size:17px;
    cursor:pointer;
    box-shadow:0 8px 18px rgba(79,70,229,0.35);
    transition:0.15s ease;
}

.badges{
    display:flex;
    justify-content:center;
    gap:25px;
    margin-top:80px;
    opacity:.55;
    font-size:13px;
}

#gifOverlay{
    position:fixed;
    inset:0;
    display:none;
    justify-content:center;
    align-items:center;
    background:rgba(0,0,0,.9);
    z-index:999;
}

#gifOverlay img{
    max-width:90%;
    max-height:90%;
    border-radius:14px;
}
</style>
</head>
<body>

<div class="card">
    <div class="domain">jamesmcalonan.co.uk</div>
    <div class="subtitle">Congratulations! This domain is available for purchase</div>
    <button id="buyBtn">Visit to Buy →</button>
</div>

<div id="gifOverlay">
    <img id="gifImg" src="">
</div>

<script>
const btn = document.getElementById("buyBtn");
const gifOverlay = document.getElementById("gifOverlay");
const gifImg = document.getElementById("gifImg");

let clicks = 0;
let dodgeEnabled = false;

setTimeout(()=> dodgeEnabled = true, 1200);

function moveBtn(){
    const pad = 120;
    const x = Math.random() * (window.innerWidth - pad);
    const y = Math.random() * (window.innerHeight - pad);

    btn.style.left = x+"px";
    btn.style.top = y+"px";
    btn.style.transform = "none";
}

document.addEventListener("mousemove", e=>{
    if(!dodgeEnabled) return;

    const rect = btn.getBoundingClientRect();
    const distX = Math.abs(e.clientX - (rect.left + rect.width/2));
    const distY = Math.abs(e.clientY - (rect.top + rect.height/2));

    if(distX < 90 && distY < 60){
        moveBtn();
    }
});

btn.addEventListener("click", ()=>{
    clicks++;
    moveBtn();

    if(clicks === 3){
        gifImg.src = "https://media0.giphy.com/media/v1.Y2lkPTc5MGI3NjExMjBnczgydDBlcmExeDAyNmJ5OXNmcWZmZWJ6dW50ZDM3Y3FjNWdsZSZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/GCO5WNzFmlc0vjK8cA/giphy.gif";
        gifOverlay.style.display = "flex";
    }
});
</script>

</body>
</html>
